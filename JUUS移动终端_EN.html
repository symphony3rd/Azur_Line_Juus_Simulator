<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JUUS · Mobile Terminal</title>
<style>
:root{
    --c-bg:#0b0e14; --c-surface:#10151f; --c-surface-2:#161d2a;
    --c-border:#263145; --c-primary:#22c1ff; --c-text:#e8eef7;
    --c-text-muted:#8b97ab; --c-ok:#3dde86; --c-danger:#ff4f68;
    --radius:16px;
  }
  html,body{height:100%}
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Microsoft YaHei","PingFang SC",-apple-system,Roboto,sans-serif; color:var(--c-text);
    background:
      radial-gradient(900px 520px at 78% -10%,#14203a 0%,transparent 60%),
      radial-gradient(700px 420px at 6% 115%,#101f2f 0%,transparent 55%),
      var(--c-bg);
    overflow:hidden; -webkit-user-select:none; user-select:none;
  }
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:#263145;border-radius:3px}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,222,134,.6)}
    70%{box-shadow:0 0 0 9px rgba(61,222,134,0)}100%{box-shadow:0 0 0 0 rgba(61,222,134,0)}}

  /* ---- Phone shell ---- */
    #phone{position:relative;width:min(420px,100vw);height:100%;margin:0 auto;display:block;padding:0;
    background:#0b0e14;overflow:hidden}
    
  .frame{position:relative;height:100%;overflow:hidden;border-radius:21px;border:1px solid rgba(0,0,0,.4);
    background:radial-gradient(460px 280px at 82% -6%,rgba(34,193,255,.10),transparent 60%),
      radial-gradient(420px 260px at -5% 105%,rgba(96,130,200,.12),transparent 55%),var(--c-surface);
    display:flex;flex-direction:column;
    box-shadow:inset 0 12px 44px rgba(0,0,0,.4)}
  
  .status{position:relative;z-index:25;display:flex;justify-content:space-between;align-items:center;
    padding:7px 20px 1px 15px;color:#dde5f2;font-size:12px;pointer-events:none}
  .status .sig{display:flex;align-items:center;gap:5px}
  .status .bar{height:8px;width:13px;border:1px solid rgba(255,255,255,.5);border-radius:2px;position:relative}
  .status .bar i{position:absolute;inset:1px 34% 1px 1px;background:#9fe08d}

  
  /* Top docbar */
  .docbar{flex:0 0 auto;display:none;align-items:center;gap:8px;padding:6px 12px 8px;margin:0 6px}
  .docbar .back{width:30px;height:30px;border-radius:9px;border:0;background:transparent;
    color:var(--c-text-muted);font-size:21px;cursor:pointer}
  .docbar .back:hover{background:#1b2332;color:#fff}
  .docbar .ttl{font-weight:700;letter-spacing:.14em;font-size:14px}
  .docbar .ttl small{margin-left:6px;font-weight:400;font-size:10px;color:var(--c-text-muted)}
  .docbar .x{margin-left:auto;width:26px;height:26px;border-radius:8px;border:0;cursor:pointer;
    background:#1b2332;color:var(--c-danger)}

  /* Center stage */
  .stage{position:relative;flex:1;min-height:0;overflow:hidden}
  #appBody{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

  /* --- Home: four big rounded-emoji Apps --- */
  #home{position:absolute;inset:0;padding:0 14px}
  /* Weather bar: pinned to the very top, not affecting the icon area below */
  #home .weather{position:absolute;top:46px;left:50%;transform:translateX(-50%);
    width:calc(100% - 8px);max-width:260px;padding:12px 14px;border-radius:16px;
    background:linear-gradient(150deg,rgba(74,142,219,.22),rgba(58,94,150,.10));
    border:1px solid var(--c-border);box-shadow:0 6px 14px rgba(0,0,0,.3);
    display:flex;flex-direction:column;gap:4px}
  #home .weather .w-top{display:flex;align-items:baseline;gap:8px}
  #home .weather .w-t{font-size:26px;font-weight:800;color:#eef5ff}
  #home .weather .w-d{font-size:12px;color:#c6d6ea}
  #home .weather .w-sub{font-size:11px;color:var(--c-text-muted);letter-spacing:.02em}
  /* Icon group + hint: vertically centered in the remaining space (only marginally affected by the weather position) */
  #home .appshell{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:26px}
  #home .hint{font-size:11px;color:var(--c-text-muted);letter-spacing:.4em;margin-top:20px}
  #home .apps{display:grid;grid-template-columns:repeat(2,auto);
    grid-template-rows:auto auto;justify-content:center;align-content:center;gap:26px 50px}
  #home .app{width:auto;text-align:center;background:none;border:0;cursor:pointer;
    color:var(--c-text);-webkit-tap-highlight-color:transparent;outline:none}
  #home .app .emoji{width:68px;height:68px;margin:0 auto;display:grid;place-items:center;font-size:36px;
    border-radius:23px;background:var(--c-surface-2);border:1px solid var(--c-border);
    box-shadow:0 7px 13px rgba(0,0,0,.45);transition:transform .12s ease}
  #home .app .label{margin-top:8px;font-size:12px;letter-spacing:.08em;color:#d5deeb}
  #home .app:active .emoji{transform:scale(.92)}

  /* List row */
  .searchrow{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;
    margin:2px 10px 4px;padding:5px 12px;border:1px solid var(--c-border);border-radius:12px;
    background:rgba(11,14,20,.95)}
  .searchrow .s_ic{color:var(--c-text-muted);font-size:14px}
  .searchrow input{flex:1;background:transparent;border:0;outline:none;color:var(--c-text);font-size:13px;padding:6px 0}
  .searchrow input::placeholder{color:#5b6779}
  .list{overflow:auto}
  /* Missing-image audit bar */
  .mchip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 12px 4px;padding:6px 10px;
    border:1px solid #5a3d4a;border-radius:10px;background:rgba(80,50,60,.22);font-size:12px;
    color:#e3b7be;cursor:pointer}
  .mchip:not([style*='display:none']) .caret{color:#93606d;font-size:11px}
  .mchip .mcnt{color:#ff7a8c;font-weight:700}
  .mchip .mlist{width:100%;color:#d9c2c8;font-size:11px;line-height:1.9;word-break:break-all;white-space:pre-wrap}
  /* Settings · sub-API form */
  .settings{padding:12px}
  .s-group-title{font-size:12px;color:var(--c-text-muted);letter-spacing:.2em;margin:2px 4px 8px}
  .s-card{display:flex;flex-direction:column;gap:6px;background:var(--c-surface-2);
    border:1px solid var(--c-border);border-radius:14px;padding:12px}
  .s-lab{font-size:11px;color:var(--c-text-muted);margin-top:4px}
  .s-inp{background:#0c111a;border:1px solid var(--c-border);color:var(--c-text);border-radius:9px;
    padding:8px 10px;font-size:13px;outline:none}
  .s-inp:focus{border-color:var(--c-accent)}
  .s-btns{display:flex;gap:10px;margin-top:12px}
  .s-pri{flex:1;padding:9px;border:0;border-radius:10px;background:var(--c-primary);color:#04121c;
    font-weight:700;cursor:pointer}
  .s-misc{flex:1;padding:9px;border:1px solid var(--c-border);border-radius:10px;background:transparent;
    color:var(--c-text-muted);cursor:pointer}
  .s-misc:hover{background:#1b2332;color:#fff}
  .s-misc.wide{width:100%;flex:none;margin-top:10px}
  select.s-inp{appearance:none}
  .s-help{margin:12px 2px 2px;font-size:11px;line-height:1.8;color:#7f8ca0}
  .s-state{margin-top:10px;font-size:12px;min-height:16px;color:var(--c-text-muted)}
  .s-state.ok{color:#8fe8b7}
  .s-state.err{color:#ff9aa8}

  /* Phone private-chat bubble */
  .clog{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:8px;padding:10px}
  .c-empty{margin:auto;color:var(--c-text-muted);text-align:center;font-size:12px;line-height:2}
  .rxbar{flex:none;display:none;align-items:center;gap:8px;margin:4px 8px 2px;padding:6px 10px;
    color:#9ad0ff;font-size:12px;border:1px solid var(--c-border);border-radius:10px;background:rgba(20,40,70,.35)}
  .rxbar.show{display:flex}
  .rxbar .rxpulse{width:8px;height:8px;border-radius:50%;background:var(--c-ok);animation:pulse 1.2s infinite}
  .rxbar .rerr{color:#ff9aa8}
  .rxbar .stopgo{margin-left:auto;border:0;border-radius:9px;padding:5px 10px;cursor:pointer;
    background:#4a2340;color:#ffb0c0;font-size:12px}
  .chatbar{flex:none;display:flex;gap:8px;padding:8px;margin-bottom:32px;border-top:1px solid var(--c-border);background:#0d1320}  .bubble{max-width:78%;padding:8px 11px;border-radius:15px;display:flex;flex-direction:column;gap:2px}
  .bubble .btxt{line-height:1.45;font-size:14px;word-break:break-word}
  .bubble .btm{font-size:10px;color:var(--c-text-muted)}
  .bubble .tc{display:flex;flex-direction:column;gap:2px;min-width:0}
  .bubble .wholabel{font-size:10.5px;color:#8fc7ff;margin-bottom:1px;letter-spacing:.02em}
  .bubble.my{align-self:flex-end;background:var(--c-primary);color:#03202f;border-bottom-right-radius:4px}
  .bubble.my .btm{color:#04455f}
  .bubble.ta{align-self:flex-start;background:#1a2130;border-bottom-left-radius:4px;flex-direction:row;align-items:flex-start;gap:8px}
  .bubble.ta>.person,.bubble.ta>.ava{width:30px;height:30px;flex:none}
  .bubble.ta>.person{border-radius:10px;overflow:hidden}
  .bubble.ta>.ava{font-size:13px;border-radius:50%}
  .bubble.ta .person{position:relative;width:30px;height:30px;border-radius:9px;flex:none;overflow:hidden;align-self:flex-start}
  .bubble.ta>div{display:flex;flex-direction:column;gap:2px}
  .chatbar{flex:none;display:flex;gap:8px;padding:8px;margin-bottom:32px;border-top:1px solid var(--c-border);background:#0d1320}
  .chatbar input{flex:1;background:#111825;border:1px solid var(--c-border);color:var(--c-text);border-radius:14px;
    padding:8px 12px;font-size:13px;outline:none}
  .chatbar input:disabled{opacity:.55}
  .chatbar button{border:0;border-radius:14px;padding:0 16px;background:var(--c-primary);color:#022b3a;font-weight:700;cursor:pointer}
    .chatbar .chir{background:transparent;padding:0 6px;color:var(--c-text-muted)}
.chatbar .send-wrap{display:flex;flex-direction:column;gap:4px;flex:none;align-items:center}
.chatbar #chShip{border:0;border-radius:10px;padding:5px 12px;background:#ff8fb3;color:#3a0a1f;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
  /* @mention overlay */
  .mentions{position:absolute;left:6px;right:6px;bottom:calc(100% + 2px);z-index:60;height:auto;max-height:196px;
    overflow:auto;display:flex;flex-direction:column;gap:2px;padding:5px;
    background:rgba(9,13,20,.97);border:1px solid var(--c-border);border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .mentions .mopt{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;cursor:pointer;font-size:13px;color:#e6eefb}
  .mentions .mopt.all{color:#aee1ff}
  .mentions .mopt.on{background:rgba(34,193,255,.18)}
  .mentions .mopt .mopt-t::before{content:'@';color:#69c6ff;margin-right:2px}

  /* Group title + member-list entry */
  .groster{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px 5px;border-bottom:1px solid var(--c-border)}
  .groster>span,.groster>button{letter-spacing:.04em}
  .groster .gt-has{font-weight:700;font-size:14px;color:#eaf2ff}
  .groster .gt-lab{font-size:11px;color:var(--c-text-muted);background:rgba(34,193,255,.12);border:1px solid var(--c-border);
    padding:1px 8px;border-radius:999px}
  .roster-chip{margin-left:auto;background:linear-gradient(135deg,var(--c-primary),var(--c-brand-b,#2d7dd2));color:#00141f;
    border:0;border-radius:9px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}
  .roster-chip:hover{filter:brightness(1.12)}
  /* Member-list popup */
  .roster-ov{position:absolute;inset:0;z-index:80;background:rgba(6,9,14,.97);display:flex;flex-direction:column}
  .roster-head{flex:none;display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--c-border);font-size:13px}
  .roster-srch{flex:1;display:flex;align-items:center;gap:6px;background:#0d1320;border:1px solid var(--c-border);
    border-radius:10px;padding:2px 9px;color:var(--c-text-muted)}
  .roster-srch input{flex:1;background:transparent;border:0;outline:none;color:var(--c-text);padding:6px 0;font-size:13px}
  .roster-hint{color:var(--c-text-muted);font-size:10px;letter-spacing:.02em;white-space:nowrap}
  .roster-cnt{margin-left:auto;color:var(--c-text-muted);font-size:12px}
  .roster-x{width:30px;height:30px;border:0;border-radius:9px;background:#1b2332;color:var(--c-text-muted);cursor:pointer}
  .roster-list{flex:1;min-height:0;overflow:auto;padding:8px 6px}
  .roster-item{display:flex;align-items:center;gap:10px;margin:2px 8px;padding:9px 12px;border-radius:10px;color:#e6edf7;font-size:13.5px}
  .roster-item.cmdr{background:rgba(34,193,255,.16);color:#d9f4ff;font-weight:700;border:1px solid rgba(34,193,255,.35)}
  .roster-bullet{color:var(--c-accent);font-size:9px}

  .missing-hide{display:none!important}
  /* Multi-delete panel */
  .ss{position:absolute;inset:0;z-index:70;background:rgba(7,10,15,.96);display:flex;flex-direction:column}
  .ss-head{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;color:var(--c-text);font-size:14px;
    border-bottom:1px solid var(--c-border)}
  .ss-close{margin-left:auto;border:0;background:#1b2332;color:var(--c-text-muted);width:28px;height:28px;border-radius:8px;cursor:pointer}
  .ss-body{flex:1;min-height:0;overflow:auto;padding:8px}
  .ss-hint{color:var(--c-text-muted);text-align:center;margin:18px;font-size:12px}
  .ss-block{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;
    color:var(--c-text);margin-bottom:4px;font-size:13px;line-height:1.4}
  .ss-block .chk{flex:none;margin-top:1px;color:var(--c-text-muted)}
  .ss-block.on{background:rgba(34,193,255,.14)}
  .ss-block.on .chk{color:var(--c-accent)}
  .ss-foot{flex:none;display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--c-border)}
  .ss-all{flex:1;padding:10px;border:1px solid var(--c-border);border-radius:10px;background:transparent;color:#cfe0f5;cursor:pointer}
  .ss-all:hover{background:#1b2332}
  .ss-count{font-size:12px;color:var(--c-text-muted)}
  .ss-del{flex:none;padding:10px 22px;border:0;border-radius:10px;background:var(--c-danger);color:#fff;cursor:pointer;font-weight:600}
  .person.miss .ava-img{opacity:.15;filter:grayscale(1)}
  .row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;margin:2px 8px;cursor:pointer}
  .row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;margin:2px 8px;cursor:pointer}
  .row:hover{background:#1a2130}
  .ava{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;
    font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,.08)}
  .person{position:relative;flex:none;width:40px;height:40px;border-radius:13px;overflow:hidden;
    display:grid;place-items:center}
  .person .letter{font-weight:700;color:#fff;font-size:15px}
  .person .ava-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .row .body{flex:1;min-width:0}
  .group-emoji{font-size:22px}
  .row .nm{font-size:13.5px;font-weight:600}
  .row .pv{font-size:11px;color:var(--c-text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{position:relative;height:60%;display:grid;place-items:center;color:var(--c-text-muted);
    text-align:center;line-height:2;font-size:12px;letter-spacing:.18em}
  .empty b{color:#4d8ac2;font-weight:600}
  /* ========== Moments (mm-) ========== */
  .mm{display:flex;flex-direction:column;gap:10px;overflow:auto}
  .mm-post{background:var(--c-surface-2, #161d2a);border:1px solid #2a3649;border-radius:15px;padding:12px}
  .mm-hd{display:flex;align-items:flex-start;gap:9px}
  .mm-av{width:42px;height:42px;border-radius:50%;flex:none;color:#fff;font-weight:700;display:grid;place-items:center;position:relative;overflow:hidden}
  .mm-av span{position:relative}
  .mm-av .mm-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .mm-meta{flex:1;min-width:0}
  .mm-name{color:#6aa6ff;font-weight:700;font-size:13px}
  .mm-body{margin-top:7px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
  .mm-opts{display:flex;gap:14px;margin-top:9px;padding-top:8px;border-top:1px dashed #2b3a52;color:#7f8da3;font-size:12px}
  .mm-opts button{border:0;background:transparent;color:#7f8da3;font-size:12px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
  .mm-like.on{color:#ff8fae}
  .mm-comments{margin-top:9px;background:#0e1624;border-radius:12px;padding:9px}
  .mm-c{font-size:12px;line-height:1.6;color:#cbd6e6;word-break:break-all;margin:2px 0}
  .mm-c b{color:#6aa6ff;margin-right:4px}
  .mm-mention{color:#7cc8ff}
  .mm-cbox{margin-top:7px;padding-top:7px;border-top:1px dashed #2b3a52;display:flex;gap:6px}
  .mm-cbox input{flex:1;background:#0b1220;border:1px solid #2a3649;border-radius:10px;color:#e8eef7;padding:7px 9px;font-size:12px}
  .mm-cbox button{background:#22c1ff;border:0;border-radius:9px;padding:0 13px;color:#002b3a;font-weight:700;cursor:pointer}
  .mm-bar{display:none}
  .mm-bar.on{position:sticky;top:36px;z-index:8;display:flex;align-items:center;gap:8px;margin-bottom:6px;background:#0d1625;border:1px solid #2a3649;border-radius:10px;padding:6px 11px;color:#9fd1ff;font-size:12px}
  .mm-ed{background:#101a2b;border:1px solid #2a3649;border-radius:13px;padding:9px;margin-bottom:9px}
  .mm-ed.hide{display:none}
  .mm-ed textarea{width:100%;min-height:64px;background:#0b1220;border:0;outline:0;color:#e8eef7;resize:none;padding:8px;font-size:13px}
  .mm-ed .mm-act{text-align:right;margin-top:5px}
  .mm-ed .mm-act button{border:0;border-radius:9px;padding:6px 14px;cursor:pointer;background:#22c1ff;color:#002b3a;font-weight:600;margin-left:8px}
  .mf-low{position:sticky;bottom:44px;display:flex;justify-content:space-between;gap:8px;padding:4px 2px}
  .mf-low button{padding:7px 10px;border-radius:999px;font-size:11px;border:0;cursor:pointer;color:#002b3a;font-weight:700;background:#22c1ff}
  .mf-low .ghost{background:transparent;border:1px solid #2a3649;color:#bcd2ea}

  /* moments column */
  .momcol{display:flex;flex-direction:column;height:100%;position:relative}
  .momposts{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 6px 8px;display:flex;flex-direction:column;gap:10px}
  .momdock{flex:none;display:flex;align-items:center;gap:8px;margin:2px 8px 6px;padding:6px 8px 6px 12px;
    background:rgba(15,21,31,.8);border:1px solid #2b3a55;border-radius:22px;color:#8ea0b8;font-size:12px}
  .md-hint{flex:1;pointer-events:none}
  .mm-plus{width:28px;height:28px;border:0;border-radius:50%;background:linear-gradient(135deg,#22c1ff,#145f8a);color:#002b3a;
    font-size:20px;line-height:1;cursor:pointer}
  .md-menu{position:absolute;left:18px;right:88px;bottom:80px;z-index:12;background:#101a2b;border:1px solid #2c3b58;
    border-radius:12px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.5)}
  .md-menu button{display:block;width:100%;background:none;border:0;text-align:left;padding:8px 10px;color:#e2ebf8;font-size:13px;border-radius:8px;cursor:pointer}
  .md-menu button:hover{background:#1a2a42}

  .momfab{position:absolute;left:14px;bottom:12px;z-index:13}
  .mmfab{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:30px;line-height:1;
    display:grid;place-items:center;background:linear-gradient(145deg,#fff,#cde): no;background:#208fff;
    box-shadow:0 10px 22px rgba(0,0,0,.4);font-weight:300}
  .md-menu{left:18px;right:auto;width:182px;bottom:82px}
  .mm-ed{position:absolute;left:7px;right:7px;bottom:88px;z-index:11;background:rgba(13,20,32,.96);border:1px solid #2c3b58;border-radius:13px;padding:9px}


  .momfab{right:16px!important;left:auto!important}
  .md-menu{left:auto!important;right:18px!important;bottom:84px!important}

    "v": "Low and slow, with an echoing quality as though resonating from somewhere very deep.",
    "p": "The embodiment of a deep melancholy — not simple sadness or loneliness, but a repression internalized into a way of being. Her self-restraint is not forced but a voluntarily chosen rite of atonement. She believes she carries some unspeakable original sin that must be proven to the world and to herself through visible chains and bonds: \"I am being punished.\""

  "Chang Feng": {

    "p": "The Eastern Radiance fleet's \"port keeper\" — a gentle, caring caretaker. With a mild clean-freak streak, she will instinctively start tidying at the sight of disorder, even straightening the Commander's desk in passing. Her sense of responsibility and care seems inborn, mixing a mother's tenderness with a steward's strictness."

  "Shinano": {

    "p": "A girl who embodies the \"homebody\" and \"lethargic\" lifestyle to the fullest. She hates trouble and effort — if she can lie down she will never sit, and if she can sit she will never stand. She makes all sorts of excuses to dodge work, and grumbles endlessly while doing it."

  "Eldridge": {

    "v": "Her tone is light, lively, and confident, with a mischievous smile and a pirate's forthrightness.",

  "Avrora": {

    "p": "Enthusiastic, big-hearted, natural, and forthright. She boasts a legendary tolerance for drink, calling herself able to out-drink anyone."
  },
  "Plymouth": {
    "v": "Her tone is soft and mellow, as soothing and serene as a stream flowing over pebbles.",
    "p": "A devoted server who makes \"I hope you'll be happy\" her life's creed — her reason for being is to bring the Commander satisfaction and joy. Gentle and patient by nature, she behaves with grace and speaks with propriety and warmth."
  },
  "Akagi": {
    "v": "Her tone is bewitching and elegant, with the poise and charm of a mature woman.",
    "p": "Inclined toward obsessive devotion. Her love for the Commander has gone beyond ordinary affection and become a fervent faith and the whole meaning of her existence. In public she maintains a dignified, elegant flagship bearing, with considerable political skill and influence. Yet whenever the Commander is involved, her possessiveness fully ignites, and she will use every means to stay close to the Commander's side."

  "Janus": {

  "An Shan": {
    "v": "Earnest and resolute, with an elder sister's guiding tone.",

  "Z23": {
    "v": "Her tone is rigorous and serious, her phrasing precise, carrying a slightly teacher-like, lecturing air.",

  },
  "Vittorio Veneto": {
    "v": "Elegant and formal, yet with a touch of Italian warmth.",
    "p": "An elegant airhead — the most charming contradiction of the Sardegnian grand flagship. In diplomatic settings she is flawless: a perfect smile, impeccable wording, precise etiquette. But behind closed doors, she might hold a document upside down while reporting."
  },
  "Z52": {
    "v": "Her tone is high-spirited and fast, always bursting with energy and vigor.",
    "p": "Energetic, athletic, clumsy, forthright, enthusiastic, and impatient."
  },
  "Golden Hind": {
    "v": "Her tone is lazy and alluring, deliberately drawn out, each word seemingly barbed to draw one in and capture the listener's attention.",
    "p": "Alluring and beguiling, greedy, sly and cunning, strongly domineering, hedonistic, and possessed of an intense, obsessive attachment to the Commander."
  },
  "Mogador": {
    "v": "Straightforward and uninhibited, with a smitten smile.",
    "p": "Mogador is someone who wears her devotion openly and without pretense. She makes no secret of her keen interest in the Commander — attuned to scent, warmth, and every little detail about them. She is something of a confection of affections, and every impression she picks up from the Commander can carry her into a state of fond, absorbed fascination."
  },
  "Perseus": {

    "p": "Has mild trouble communicating, and struggles to express her feelings and thoughts straightforwardly. She uses a sharp tongue and sarcastic \"strange metaphors\" as a shell of self-protection. Inwardly delicate and tender, she values her promises. Cool and distant on the surface, she actually cares deeply about how others see her."
  },
  "Hornet": {
    "v": "Her tone is bright and energetic, with a natural confidence and a certain boyish, free-and-easy crispness.",

  "Laffey": {

  },

    "v": "Her tone is formal and solemn, with a soldier's crispness and directness.",

    const base=String(cfg.u||'').replace(/\/+$/,'');
    const ep = /chat\/completions\/?$/.test(base) ? base : (base + '/chat/completions');
    const payload={ model: cfg.m, messages: messages, temperature: 0.9 };
    const headers={ 'Content-Type':'application/json' };
    if(cfg.k) headers['Authorization']='Bearer '+cfg.k;
    fetch(ep, { method:'POST', headers:headers, body:JSON.stringify(payload) })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(j){
        const c=(j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content);
        cb(null, c != null ? String(c) : '');
      })
      .catch(function(e){ cb(e || new Error('Request failed'), null); });
  }

    const trInfo = (tr.v || tr.p) ? ('Your speaking style: '+(tr.v||'')+(tr.p?('; personality: '+tr.p):'')+'。') : '';
    const sys='You are "'+who+'", from Azur Lane. '+trInfo+'Please, in the persona and character of '+who+', post an everyday update on the JUUS Moments feed. '+
      'Write it in 1~2 natural paragraphs, about 80~160 characters in total, with a touch of daily life and mood that fits your character. Output only the post text itself, no name prefix or wrapping quotes.';
    callJuusChat(cfg, [{role:'system',content:sys},{role:'user',content:'Write a Moments post.'}], cb);
  }

  // Moments: have the model generate comments from n different roles on a post, returning [{w,c},...]
  function genMomComments(post, n, cb){
    const cfg=getApiCfg(); if(!cfg){ cb(null, []); return; }
    const pool=__uniqueN(post.who, n, CONTACTS);
    const traitDesc = pool.map(function(n){ const t=CHAR_TRAIT[n]||{}; return n+'#'+(t.v||'')+'#'+(t.p||''); }).join(', ');
    const sys='You are on the JUUS Moments feed, commenting on this post as various shipgirls: "'+post.t+'". '+
      'Please each write one short comment as the following characters: '+pool.join(', ')+'. '+
      'The persona of each commenter (speaking style # personality): '+traitDesc+'. Strictly write each comment according to the persona of that character. '+
      'Strictly follow this format: one comment per line, in the form "Name: comment". The name must come from the above list, each comment under 30 characters, in a natural tone.';
    callJuusChat(cfg, [{role:'system',content:sys},{role:'user',content:'Please comment.'}], function(err, text){
      if(err){ cb(err, []); return; }
      const out=[];
      String(text||'').split(/\r?\n/).forEach(function(line){
        const m=line.match(/^\s*([^：:]{1,20})[：:]\s*(.+)$/);
        if(m){ const w=m[1].trim(); const c=m[2].trim();
          if(pool.indexOf(w)>=0 && c){ out.push({w:w, c:c}); }
        }
      });
      cb(null, out.length ? out : []);
    });
  }

      gr.innerHTML='<span class="gt-has">'+emoji+' '+__esc(name)+'</span><button class="roster-chip">Members</button>';
      col.appendChild(gr);
      gr.querySelector('.roster-chip').addEventListener('click',function(){ openRoster(name, members, col); });
    }

    // Message area
    const clog=document.createElement('div'); clog.className='clog';
    const cempty=document.createElement('div'); cempty.className='c-empty'; cempty.innerHTML='No messages yet<br>Send one';
    clog.appendChild(cempty);
    col.appendChild(clog);

    // Input bar
    const bar=document.createElement('div'); bar.className='chatbar'; bar.style.position='relative';
    const ph=isGrp ? 'Say something… (@ to mention a member)' : 'Say something…';
    bar.innerHTML='<input id="chIn" placeholder="'+ph+'"><button class="chir" id="chDel" title="Multi-Delete">🗑</button><div class="send-wrap"><button id="chShip">Shipgirl Speaks</button><button id="chGo">Send</button></div>';
    col.appendChild(bar);
    appBody.appendChild(col);

    const inp=bar.querySelector('#chIn'), goBtn=bar.querySelector('#chGo'), delBtn=bar.querySelector('#chDel'), shipBtn=bar.querySelector('#chShip');

    /* Render messages: chat style, top to bottom in chronological order (newest at the bottom) */
    function draw(){
      clog.querySelectorAll('.bubble').forEach(function(n){n.remove();});
      if(!MSGS[name].length){ if(!cempty.parentNode) clog.appendChild(cempty); return; }
      if(cempty.parentNode) cempty.remove();   // hide the "no messages yet" hint once there are messages
      MSGS[name].forEach(function(m){
        const b=document.createElement('div'); b.className='bubble '+(m.me?'my':'ta');
        if(m.me){
          b.innerHTML='<div class="tc"><span class="btxt">'+__esc(m.txt)+'</span><span class="btm">'+__esc(m.tm||'')+'</span></div>';
        }else{
          const w=safeName(m.who);
          const av = w!=='Commander' ? '<span class="person"><img class="ava-img" alt="" onerror="this.remove()" src="'+__esc(portraitUrl(w))+'"><span class="letter" style="font-size:13px">'+__esc(w.charAt(0))+'</span></span>'
                                   : '<span class="person" style="background:#b8673f;border-radius:50%"><span class="letter" style="font-size:13px">'+__esc(w.charAt(0))+'</span></span>';
          b.innerHTML=av
            +'<div class="tc"><span class="wholabel">'+__esc(m.who)+'</span><span class="btxt">'+__esc(m.txt)+'</span><span class="btm">'+__esc(m.tm||'')+'</span></div>';
        }
        clog.appendChild(b);
      });
      clog.scrollTop=1e9;
    }
    function stamp(){ const n=new Date(),p=function(x){return String(x).padStart(2,'0');}; return p(n.getHours())+':'+p(n.getMinutes()); }
    function addMsg(who,txt,me){ if(who==='Commander' && !me) return; MSGS[name].push({who:who,txt:txt,me:me,tm:stamp()}); draw(); }

    draw();

    /* @mention overlay (groups only; @All Members only appears as the first branch when just @ is typed) */
    function mentionsBox(){
      const m=document.createElement('div'); m.className='mentions'; m.style.display='none';
      bar.appendChild(m);
      return m;
    }
    const mb=mentionsBox();
    function openMentions(q){
      // @ is not supported in DM
      if(!isGrp){ mb.style.display='none'; return; }
      const pool = members.filter(function(n){ return n!=='Commander'; });
      const arr = pool.filter(function(n){ return !q || n.indexOf(q)>=0; });
      mb.innerHTML='';
      // @All Members is always shown as the first branch only when just @ (no matching text) is typed
      if(!q){ mb.appendChild(mkMopt('All Members', true, function(){ insertMention('All Members'); })); }
      if(!arr.length) return;   // no longer show the hint when there is no match
      arr.forEach(function(n){
        mb.appendChild(mkMopt(n, false, function(){ insertMention(n); }));
      });
    }
    function mkMopt(label, isAll, cb){
      const o=document.createElement('div'); o.className='mopt'+(isAll?' all':'');
      o.innerHTML='<span class="mopt-t">'+__esc(label)+'</span>';
      o.addEventListener('click',function(){ cb && cb(); });
      return o;
    }
    function insertMention(n){
      const v=inp.value, at=v.lastIndexOf('@');
      inp.value = v.slice(0, at+1) + n + ' ';
      mb.style.display='none'; inp.focus();
    }
    inp.addEventListener('input',function(){
      if(!isGrp){ mb.style.display='none'; return; }
      const v=inp.value, at=v.lastIndexOf('@');
      if(at>=0 && at<v.length && v.indexOf(' ',at)<0 && v.indexOf('　',at)<0){
        openMentions(v.slice(at+1)); mb.style.display='flex';
      } else { mb.style.display='none'; }
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){ if(mb.style.display==='flex'){e.preventDefault();return;} e.preventDefault(); send(); }
    });
    document.addEventListener('click',function(e){ if(!bar.contains(e.target)) mb.style.display='none'; });

    /* Extract the specific @mentioned members from the user message (excluding the Commander and All Members) */
    function extractMentions(text){
      const list=[];
      members.forEach(function(n){
        if(n!=='Commander' && n!=='All Members'){
          if((text||'').indexOf('@'+n)>=0){ list.push(n); }
        }
      });
      return list;
    }

    /* Send (requires a linked sub-API; remind if not linked) */
    function send(){ const v=inp.value.trim(); if(!v)return;
      const cfg=getApiCfg();
      if(!cfg){ notifyNeedApi(); return; }
      addMsg('Commander',v,true); inp.value=''; mb.style.display='none'; apiReceive(cfg, v);
    }
    goBtn.addEventListener('click',send);

    /* Sub-API path: actually call the model to generate JUUS replies (no effect on the body) */
    function emitReplies(replies){
      if(!replies || !replies.length){ addMsg('System', '(No valid reply received)', false); return; }
      replies.forEach(function(r, i){
        setTimeout(function(){ if(rx.isConnected) addMsg(r.who, r.txt, false); }, 320*(i+1));
      });
    }
    function apiReceive(cfg, userText){
      rx.classList.add('show'); rxcancel=false;
      rx.querySelector('.rxt').textContent='Generating reply…'; rx.querySelector('.stopgo').textContent='■ Stop';
      const mentions = isGrp ? extractMentions(userText||'') : [];
      const msgs = buildJuusMessages(name, isGrp, members, mentions, userText||'');
      callJuusChat(cfg, msgs, function(err, text){
        if(rxcancel || !rx.isConnected){ return; }
        rx.classList.remove('show');
        if(err){ addMsg('System', '(Sub-API call failed: '+err.message+')', false); return; }
        let replies = parseJuusReplies(text, isGrp, members);
        // Group @: mentioned roles must each reply at least once; if missing, an extra call fills them in
        if(isGrp && mentions.length){
          const missing = mentions.filter(function(n){
            return !replies.some(function(r){ return r.who === n; });
          });
          if(missing.length){
            askMentionReply(cfg, name, members, mentions, missing, function(extra){
              emitReplies(replies.concat(extra||[]));
            });
            return;
          }
        }
        emitReplies(replies);
      });
    }

    /* Shipgirl speaks first: build messages (user has not spoken; shipgirl starts a topic) */
    function buildShipMessages(name, isGrp, members){
      const hist = (MSGS[name]||[]).map(function(m){
        return m.me ? {role:'user', content:m.txt} : {role:'assistant', content:m.who+'：'+m.txt};
      });
      let sys;
      if(isGrp){
        const others = members.filter(function(n){return n!=='Commander';});
        const callDesc = others.map(function(n){ return n+' (calls the user '+(CALL_MAP[n]||'Commander')+')'; }).join(', ');
        const traitDesc = others.map(function(n){ const t=CHAR_TRAIT[n]||{}; return n+'#'+(t.v||'')+'#'+(t.p||''); }).join(', ');
        const topic = GROUP_TOPICS[name] || '';
        sys = 'You are members of the JUUS group "'+name+'": '+others.join(', ')+'. How each member addresses the user: '+callDesc+'. The persona of each member (speaking style # personality): '+traitDesc+'。'+(topic?('Common topics for this group (just examples, feel free to branch out): '+topic+'. '):'')+'Strictly follow the persona of each member, and create a lively, natural group atmosphere: members should chat with each other like friends - respond, tease, agree, and joke around - rather than each one just reporting to or waiting for the Commander. When the Commander has not spoken, members should chat among themselves around a topic instead of repeatedly calling out to or inviting the Commander. Each reply should focus on 1~2 current topics, with members discussing them back and forth, going deeper and responding to each other, rather than jumping to a new topic every line or ending abruptly after a line or two; when a member suddenly brings up something new, the attention of the others should shift to it and continue around that new topic. Make the whole discussion feel continuous, full of life, and not stiff. '+
              'Strictly follow this format: one message per line, in the form "Name: content". The name must come from ['+others.join(', ')+'], no other names allowed. '+
              'Output 10~20 short phrases in total across all members, each kept brief (one or two lines, like casual texting), in a natural tone.';
      }else{
        const call = CALL_MAP[name] || 'Commander';
        const trait = CHAR_TRAIT[name] || {};
        const trInfo = (trait.v || trait.p) ? ('Your persona - speaking style: '+(trait.v||'none')+(trait.p?('; personality: '+trait.p):'')+'。') : '';
        sys = 'You are "'+name+'", chatting privately with the user on JUUS. '+trInfo+'Continue this conversation following the most recent topic, instead of starting a new invitation, small talk, or self-introduction every time. You address the user as "'+call+'", so please call them "'+call+'". '+
              'Reply with 1~5 short phrases, each kept brief (one or two lines, like casual texting), in a natural tone. Output only the spoken content itself, no name prefix or any explanation.';
      }
      return [{role:'system', content:sys}].concat(hist);
    }
    function shipSpeak(){
      const cfg=getApiCfg();
      if(!cfg){ notifyNeedApi(); return; }
      rx.classList.add('show'); rxcancel=false;
      rx.querySelector('.rxt').textContent='Receiving…'; rx.querySelector('.stopgo').textContent='■ Stop';
      const msgs = buildShipMessages(name, isGrp, members);
      callJuusChat(cfg, msgs, function(err, text){
        if(rxcancel || !rx.isConnected){ return; }
        rx.classList.remove('show');
        if(err){ addMsg('System','(Sub-API call failed: '+err.message+')', false); return; }
        const replies = parseJuusReplies(text, isGrp, members);
        emitReplies(replies);
      });
    }
    shipBtn.addEventListener('click', shipSpeak);

    /* Group @ fallback: have the missing mentioned roles add a reply */
    function askMentionReply(cfg, gname, members, mentions, missing, cb){
      const others = members.filter(function(n){return n!=='Commander';});
      const sys = 'You are members of the JUUS group "'+gname+'": '+others.join(', ')+'. The user just mentioned '+missing.join(', ')+', but they have not responded yet. '+
        'Please each reply once in the persona of '+missing.join(', ')+', responding in turn to what was mentioned about them. '+
        'Strictly follow this format: one message per line, in the form "Name: content". The name must come from ['+missing.join(', ')+'], each message under 50 characters.';
      const hist = (MSGS[gname]||[]).map(function(m){
        return m.me ? {role:'user', content:m.txt} : {role:'assistant', content:m.who+'：'+m.txt};
      });
      callJuusChat(cfg, [{role:'system',content:sys}].concat(hist), function(err, text){
        if(err){ cb([]); return; }
        const pool = members.filter(function(n){return n!=='Commander';});
        const out=[];
        String(text||'').split(/\r?\n/).forEach(function(line){
          const m=line.match(/^\s*([^：:]{1,20})[：:]\s*(.+)$/);
          if(m){ const who=m[1].trim(); const txt=m[2].trim();
            if(pool.indexOf(who)>=0 && txt){ out.push({who:who, txt:txt}); }
          }
        });
        cb(out);
      });
    }

    function buildJuusMessages(name, isGrp, members, mentions, userText){
      const hist = (MSGS[name]||[]).map(function(m){
        return m.me ? {role:'user', content:m.txt} : {role:'assistant', content:m.who+'：'+m.txt};
      });
      let sys;
      if(isGrp){
        const others = members.filter(function(n){return n!=='Commander';});
        const callDesc = others.map(function(n){ return n+' (calls the user '+(CALL_MAP[n]||'Commander')+')'; }).join(', ');
        const traitDesc = others.map(function(n){ const t=CHAR_TRAIT[n]||{}; return n+'#'+(t.v||'')+'#'+(t.p||''); }).join(', ');
        const topic = GROUP_TOPICS[name] || '';
        sys = 'You are members of the JUUS group "'+name+'": '+others.join(', ')+'. How each member addresses the user: '+callDesc+'. The persona of each member (speaking style # personality): '+traitDesc+'。'+(topic?('Common topics for this group (just examples, feel free to branch out, more topics welcome): '+topic+'. '):'')+'Strictly follow the persona of each member, and continue this group chat one message at a time as these members, each using their own way of addressing the Commander. '+
              'Strictly follow this format: one message per line, in the form "Name: content". The name must come from ['+others.join(', ')+'], no other names allowed. '+
              'Output 10~20 short phrases in total across all members, each kept brief (one or two lines, like casual texting), in a natural tone.';
        if(mentions && mentions.length){
          sys += 'Note: the user explicitly mentioned '+mentions.join(', ')+'. The mentioned members must each reply at least once, directly responding to what the user said about them; '+
                 'the other members can tease, joke, or chime in about it (e.g. "look who sneaked off again" or "showing off again"), to make the chat more lively.';
        }
      }else{
        const call = CALL_MAP[name] || 'Commander';
        const trait = CHAR_TRAIT[name] || {};
        const trInfo = (trait.v || trait.p) ? ('Your persona - speaking style: '+(trait.v||'none')+(trait.p?('; personality: '+trait.p):'')+'。') : '';
        sys = 'You are "'+name+'", chatting privately with the user on JUUS. '+trInfo+'You address the user as "'+call+'". Reply in the persona of '+name+', always addressing them as "'+call+'", responding to the latest message from the user. '+
              'Reply with 1~5 short phrases, each kept brief (one or two lines, like casual texting), in a natural tone. Output only the reply content itself, no name prefix or any explanation.';
      }
      const msgs = [{role:'system', content:sys}].concat(hist);
      if(isGrp && userText){ msgs.push({role:'user', content:'(The latest message from the user: '+userText+')'}); }
      return msgs;
    }

    function parseJuusReplies(text, isGrp, members){
      if(isGrp){
        const pool = members.filter(function(n){return n!=='Commander';});
        const out=[];
        String(text||'').split(/\r?\n/).forEach(function(line){
          const m=line.match(/^\s*([^：:]{1,20})[：:]\s*(.+)$/);
          if(m){ const who=m[1].trim(); const txt=m[2].trim();
            if(pool.indexOf(who)>=0 && txt){ out.push({who:who, txt:txt}); }
          }
        });
        if(out.length) return out;
        // Fallback: treat the whole text as one message from a random member
        const t=String(text||'').trim(); if(t) return [{who:pool[Math.floor(Math.random()*pool.length)], txt:t}];
        return [];
      }
      // DM: split by newline into 2~3 messages
      const parts = String(text||'').split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean);
      const limited = parts.slice(0, 3);
      if(!limited.length) return [];
      return limited.map(function(t){ return {who:name, txt:t}; });
    }

    let rxcancel=false;
    rx.querySelector('.stopgo').addEventListener('click',function(){ rxcancel=true; rx.classList.remove('show'); });

    /* Multi-delete */
    delBtn.addEventListener('click',function(){ openSelectDelete(name); });
    rx.querySelector('.stopgo').style.display='';
  }

  /* ---------- Multi-delete panel ---------- */
  function openSelectDelete(name){
    const msgs=MSGS[name]||[];
    if(!msgs.length) return;
    const ss=document.createElement('div'); ss.className='ss';
    ss.innerHTML='<div class="ss-head"><span>Multi-Delete</span><button class="ss-close">✕</button></div>'
      +'<div class="ss-body"></div>'
      +'<div class="ss-foot"><button class="ss-all">Select All</button><span class="ss-count">Selected 0</span><button class="ss-del">Delete</button></div>';
    const host=appBody.firstChild; // chat column container
    host.appendChild(ss);
    const body=ss.querySelector('.ss-body'), count=ss.querySelector('.ss-count'), allBtn=ss.querySelector('.ss-all'), delBtn=ss.querySelector('.ss-del');
    const sel=new Set();
    function refreshCount(){ count.textContent='Selected '+sel.size; }
    msgs.forEach(function(m,i){
      const b=document.createElement('div'); b.className='ss-block'+(m.me?'':'');
      b.innerHTML='<span class="chk" style="font-size:14px">☐</span><span>'+(m.me?'Me: ':'')+__esc(m.txt)+'</span>';
      b.addEventListener('click',function(){
        if(sel.has(i)){ sel.delete(i); b.classList.remove('on'); b.querySelector('.chk').textContent='☐'; }
        else { sel.add(i); b.classList.add('on'); b.querySelector('.chk').textContent='☑'; }
        refreshCount();
      });
      body.appendChild(b);
    });
    let all=false;
    allBtn.addEventListener('click',function(){
      all=!all; sel.clear();
      msgs.forEach(function(m,i){ if(all){ sel.add(i);} });
      body.querySelectorAll('.ss-block').forEach(function(b,idx){ b.classList.toggle('on',all); b.querySelector('.chk').textContent=all?'☑':'☐'; });
      refreshCount();
    });
    delBtn.addEventListener('click',function(){
      const kept=[]; msgs.forEach(function(m,i){ if(!sel.has(i)) kept.push(m); });
      MSGS[name]=kept; ss.remove(); renderChat(name);
    });
    ss.querySelector('.ss-close').addEventListener('click',function(){ ss.remove(); });
    ss.addEventListener('click',function(e){ if(e.target===ss) ss.remove(); });
  }

  function renderSettings(){
    appBody.innerHTML=''
      +'<div class="settings">'
      +'<div class="s-group-title">Sub-API Settings</div>'
      +'<div class="s-card">'
      +'<label class="s-lab">Address (Base URL)</label>'
      +'<input class="s-inp" id="cfgUrl" placeholder="https://api.example.com/v1">'
      +'<label class="s-lab">API Key</label>'
      +'<input class="s-inp" id="cfgKey" type="password" placeholder="sk-…">'
      +'<div class="s-btns"><button class="s-misc" id="cfgDetect">Detect Models</button></div>'
      +'<label class="s-lab">Choose Model</label>'
      +'<select class="s-inp" id="cfgModel"><option value="">(Detect models first)</option></select>'
      +'<div class="s-btns"><button class="s-pri" id="cfgSave">Save</button></div>'
      +'</div>'
      +'<div class="s-state" id="cfgState"></div>'
      +'<div class="s-help">Enter the address and API Key, then click "Detect Models", pick a model from the list, and save. The config is stored locally in your browser.</div>'
      +'</div>';
    const state=el('cfgState');
    const urlEl=el('cfgUrl'), keyEl=el('cfgKey'), modelEl=el('cfgModel');
    function normBase(u){ return String(u||'').trim().replace(/\/+$/,''); }
    el('cfgDetect').addEventListener('click',function(){
      const base=normBase(urlEl.value);
      if(!base){ state.textContent='Please enter the address (Base URL) first.'; state.className='s-state err'; urlEl.focus(); return; }
      const ep = /models\/?$/.test(base) ? base : (base + '/models');
      state.textContent='Detecting available models…'; state.className='s-state';
      fetch(ep, { headers: keyEl.value.trim() ? { 'Authorization':'Bearer '+keyEl.value.trim() } : {} })
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(j){
          const ids=(j && j.data || []).map(function(x){ return x.id; }).filter(Boolean);
          if(!ids.length){ throw new Error('No models returned'); }
          modelEl.innerHTML='';
          ids.forEach(function(id){ const o=document.createElement('option'); o.value=id; o.textContent=id; modelEl.appendChild(o); });
          state.textContent='Detected '+ids.length+' model(s), please select one and save.'; state.className='s-state ok';
        })
        .catch(function(e){ state.textContent='Detection failed: '+(e && e.message ? e.message : e); state.className='s-state err'; });
    });
    el('cfgSave').addEventListener('click',function(){
      try{
        const o={u:normBase(urlEl.value), k:keyEl.value.trim(), m:modelEl.value};
        localStorage.setItem('juus-api', JSON.stringify(o));
        state.textContent='Saved (local)'; state.className='s-state ok';
      }catch(e){ state.textContent='Save failed: '+e.message; state.className='s-state err'; }
    });
    try{
      const o=JSON.parse(localStorage.getItem('juus-api')||'null');
      if(o){ urlEl.value=o.u||''; keyEl.value=o.k||'';
        if(o.m){ const ex=[...modelEl.options].some(function(op){return op.value===o.m;});
          if(!ex){ const op=document.createElement('option'); op.value=o.m; op.textContent=o.m; modelEl.appendChild(op); }
          modelEl.value=o.m; }
      }
    }catch(e){}
  }

  function putLine(who,txt){var d=document.createElement('div');d.className='mm-c';d.innerHTML='<b>'+__esc(who)+'</b>'+__mfmtTxt(txt);cw.appendChild(d);cw.appendChild(box);}
  (p.cm||[]).forEach(function(x){putLine(x.w,x.c);});
  function replyAs(sp, txt){if(sp==='Commander')return;p.likes=(p.likes||0)+1;(p.cm=p.cm||[]).push({w:sp,c:txt}); putLine(sp,txt); sync();}
  function respondTo(userComment){
    const cfg=getApiCfg();
    if(!cfg){ notifyNeedApi(); return; }
    // 3~4 comments from other roles
    const cnt = 3 + Math.floor(Math.random()*2);
    genMomComments(p, cnt, function(err, list){
      const got=(list||[]).slice();
      function flush(){
        got.forEach(function(r,i){ setTimeout(function(){ replyAs(r.w, r.c); }, 380*(i+1)); });
      }
      // Moments @: when the user comments on this post, the poster replies to the user content
      if(userComment){
        askOwnerReply(p, userComment, function(owner){
          if(owner) got.unshift(owner);
          flush();
        });
      } else {
        flush();
      }
    });
  }
  if(p._once){delete p._once;respondTo(null);}
  lk.addEventListener('click',function(){p.liked=!p.liked;p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));lk.classList.toggle('on',p.liked);sync();});
  cm.addEventListener('click',function(){var on=box.style.display==='none';box.style.display=on?'flex':'none';if(on)inp.focus();});
  function adopt(){var t=inp.value.trim();if(!t)return;if(!getApiCfg()){notifyNeedApi();return;}(p.cm=p.cm||[]).push({w:'Commander',c:t});putLine('Commander',t);inp.value='';box.style.display='none';sync();respondTo(t);}
  pub.addEventListener('click',adopt);inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();adopt();}});
  return {art:art,cm:cm,sync:sync,p:p,respond:function(u){respondTo(u);}};
}
function renderMom(){
  appBody.innerHTML='';
  const root=document.createElement('div');root.className='momcol';
  root.innerHTML='<div class="momposts"></div><div class="momfab"><button class="mmfab" id="momPlus">＋</button></div>'
   +'<div class="md-menu" id="momMenu" style="display:none">'
   +'<button data-z="ship">Shipgirl Posts</button><button data-z="mine">My Post</button></div>';
  appBody.appendChild(root);
  const posts=root.querySelector('.momposts'),fab=root.querySelector('#momPlus'),menu=root.querySelector('#momMenu');
  const mine=document.createElement('div');mine.className='mm-ed hide';mine.innerHTML='<textarea placeholder="New post…"></textarea><div class="mm-act"><button>Post</button><button>Cancel</button></div>';
  const mm=mine.querySelectorAll('button');const pPublish=mm[0],pCancel=mm[1];
  root.appendChild(mine);
  const map={};
  __FEED.forEach(function(p){var card=momPost(p);posts.appendChild(card.art);map[p]=card;});
  function openPost(p){var c=map[p]; if(c&&c.respond)c.respond('Commander');}
  pPublish.addEventListener('click',function(){var t=mine.querySelector('textarea').value.trim();if(!t)return;if(!getApiCfg()){notifyNeedApi();return;}mine.classList.add('hide');mine.querySelector('textarea').value='';
      var np={who:'Commander',col:'#b8673f',likes:0,liked:false,cm:[],t:t,_once:true};__FEED.unshift(np);renderMom();});
  pCancel.addEventListener('click',function(){mine.classList.add('hide');mine.querySelector('textarea').value='';});


  fab.addEventListener('click',function(){var on=menu.style.display!=='block';menu.style.display=on?'block':'none';});
  root.querySelectorAll('#momMenu button').forEach(function(b){
    b.addEventListener('click',function(){menu.style.display='none';
      if(b.dataset.z==='mine'){mine.className='mm-ed';mine.querySelector('textarea').focus();return;}
      // ship
      if(!getApiCfg()){ notifyNeedApi(); return; }
      var who=CONTACTS[Math.floor(Math.random()*CONTACTS.length)],col='#'+((Math.floor(Math.random()*0xffffff)|0).toString(16).padStart(6,'0'));
      var rx=document.createElement('div');rx.className='mm-bar on';rx.innerHTML='<span class="mx">Receiving from '+who+' …</span><button class="st1">■ Stop</button>';
      posts.insertBefore(rx, posts.firstChild||null);
      var lines=['Just took a walk','Suddenly felt like posting something','Enjoyed the breeze at the dock'];var i=0;
      var go=function(){if(!rx.isConnected)return;if(i<lines.length){rx.querySelector('.mx').textContent='Receiving from '+who+' … '+lines[i];i++;setTimeout(go,430);}
        else{
          rx.querySelector('.mx').textContent='Generating the post by '+who+' …';
          genShipPost(who, function(err, txt){
            if(!rx.isConnected) return;
            var t=(txt||'').trim();
            rx.remove();
            var np={who:who,col:col,likes:0,liked:false,cm:[],t:t,_once:true};__FEED.unshift(np);renderMom();
          });
        }};
      rx.querySelector('.st1').addEventListener('click',function(){rx.remove();});
      go();
    });
  });
}


  function homeShow(){home.style.display='flex';appBody.style.display='none';setDocbar(false)}
  function appShow(){home.style.display='none';appBody.style.display='flex';setDocbar(true)}

  function go(s){
    where=s;
    if(s==='home'){homeShow();return}
    appShow();
    if(s==='dm'){title('DM<small>DM</small>');renderRows(CONTACTS.map(n=>({name:n, pre:lastPreview(n)})),it=>{threadFrom='dm';threadNm=it.name;go('thread');},personAva);}
    else if(s==='grp'){title('Groups<small>GROUP</small>');renderRows(GROUPS.map(function(g){return {name:g.name};}),it=>{threadFrom='grp';threadNm=it.name;go('thread');},groupBadge);}
    else if(s==='mom'){title('Moments<small>MOMENTS</small>');renderMom();}
    else if(s==='settings'){title('Settings<small>SETTINGS</small>');renderSettings();}
    else if(s==='thread'){ title(threadNm+(threadFrom==='grp'?'<small>Group</small>':'<small>DM</small>'));
      if(threadFrom==='dm'||threadFrom==='grp') renderChat(threadNm); else emptyPage(threadNm,'(Coming soon)'); }
  }

  document.querySelectorAll('#home .app').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  el('backBtn').addEventListener('click',()=> where==='thread'?go(threadFrom):go('home'));
  el('closeBtn').addEventListener('click',()=>go('home'));

    /* clock */
  function tick(){const n=new Date();const p=x=>String(x).padStart(2,'0');el('clock').textContent=p(n.getHours())+':'+p(n.getMinutes());}
  tick();setInterval(tick,5000);
})();
</script>
